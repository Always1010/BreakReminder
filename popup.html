<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="popup-header">
    <div class="brand"><span class="logo" aria-hidden="true">◒</span><div><h1>休息提醒</h1><small>让身体跟上节奏</small></div></div>
    <span class="live-dot" title="计时器运行状态" aria-hidden="true"></span>
  </header>
  <section class="timer-panel">
    <div id="status" class="status">正在读取…</div>
    <div id="timer" class="timer">--:--</div>
    <p id="detail" class="muted"></p>
  </section>
  <div id="soundControl" class="sound-control" hidden><span id="soundText"></span><button id="stopSound" class="sound-stop" type="button">停止声音</button></div>
  <div class="popup-actions">
    <button id="pause" class="primary" type="button">暂停功能</button>
    <button id="reset" class="secondary" type="button">重置当前计时</button>
  </div>
  <label class="display-sleep-control"><span><strong>允许屏幕自动熄灭</strong><small>关闭后，浏览器运行期间保持屏幕常亮</small></span><input id="displaySleepAllowed" type="checkbox" role="switch"></label>
  <button id="options" class="link" type="button">打开完整设置 <span aria-hidden="true">→</span></button>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
